name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - run: flutter create --org com.my --project-name expense_tracker .
      - run: |
          cp main.dart lib/main.dart
          cp my_pubspec.yaml pubspec.yaml
          echo "kotlin.jvm.target.validation.mode=ignore" >> android/gradle.properties
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_SMS"/><uses-permission android:name="android.permission.RECEIVE_SMS"/><uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: expense-apk
          path: build/app/outputs/flutter-apk/app-release.apk
