      - name: Phase 14 setup (secure storage, fingerprint, screenshot block)
        run: |
          flutter pub add flutter_secure_storage:^9.2.4 local_auth:^2.3.0
          sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC"/><application|' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/minSdk(Version)?( =)? ?flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle* || true
          mkdir -p android/app/src/main/kotlin/com/my/expense_tracker
          cat > android/app/src/main/kotlin/com/my/expense_tracker/MainActivity.kt <<'KOT'
          package com.my.expense_tracker

          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterFragmentActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "app/secure").setMethodCallHandler { call, result ->
                      if (call.method == "set") {
                          val on = call.arguments as Boolean
                          runOnUiThread {
                              if (on) window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                              else window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                          }
                          result.success(null)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KOT
